<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking de Moedas | LIVE REWARDS</title>
    <meta
      name="description"
      content="Ranking manual de jogadores e moedas do LIVE REWARDS."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell ranking-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-title">LIVE REWARDS</div>
          <div class="status-row">
            <div class="status-pill manual-pill">
              <span class="status-dot" aria-hidden="true"></span>
              <span>RANKING MANUAL</span>
            </div>
          </div>
        </div>

        <div class="balance-wrap" aria-label="Total de moedas no ranking">
          <div class="balance-row">
            <span class="coin-icon" aria-hidden="true">🪙</span>
            <span id="balanceValue">0</span>
          </div>
          <div class="balance-unit">MOEDAS NO RANKING</div>
        </div>
      </header>

      <main class="public-main">
        <section class="viewer-card featured-card" aria-live="polite">
          <div class="card-shell">
            <div class="card-header">
              <span class="mini-pill">LÍDER DO RANKING</span>
              <span class="hint-text">ATUALIZAÇÃO EM TEMPO REAL</span>
            </div>
            <div id="featuredPlayer" class="featured-player">
              <span class="featured-medal" aria-hidden="true">🏆</span>
              <span class="featured-name">Adicione jogadores pelo painel</span>
              <span class="featured-coins">🪙 0 moedas</span>
            </div>
          </div>
        </section>

        <section class="reward-panel leaderboard-panel" aria-labelledby="rankingTitle">
          <div class="panel-header" id="rankingTitle">
            <span>RANKING GERAL</span>
            <span id="playerCount" class="ranking-count">0 JOGADORES</span>
          </div>
          <ol id="top10List" class="top10-list leaderboard-list" aria-live="polite"></ol>
        </section>
      </main>
      <a class="admin-link" href="/admin">PAINEL ADMINISTRATIVO <span aria-hidden="true">↗</span></a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="public.js"></script>
  </body>
</html>
